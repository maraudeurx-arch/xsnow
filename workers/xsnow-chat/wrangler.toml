name = "xsnow-chat"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

# Anonymous /stats events and the owner ideas inbox (`community_idea` rows).
# Database already exists; apply schema with
# `npx wrangler d1 migrations apply xsnow-opc-stats --remote`.
#
# Owner inbox email (required for the development team to receive Vos idées):
#   npx wrangler secret put RESEND_API_KEY
# Optional From (verified Resend domain). Default: beth.t@example.com
#   npx wrangler secret put IDEAS_FROM_EMAIL
# Optional compile page:
#   npx wrangler secret put IDEAS_OWNER_SECRET
# CORS allowlist lives in src/cors.ts (GitHub Pages + opencommunity.app, never *).
# Proximity-alert SMS (optional; soft-fails if unset):
#   npx wrangler secret put TWILIO_ACCOUNT_SID
#   npx wrangler secret put TWILIO_AUTH_TOKEN
#   npx wrangler secret put TWILIO_FROM_NUMBER
# D1 table `proximity_alerts`: `npx wrangler d1 migrations apply xsnow-opc-stats --remote`
# Do not put secrets in this file.
[[d1_databases]]
binding = "DB"
database_name = "xsnow-opc-stats"
database_id = "c3453c09-78f8-477a-bb31-5f5ee9611bdb"
migrations_dir = "migrations"

# Web Push (VAPID). Public values only; VAPID_PRIVATE_KEY is a worker secret (wrangler secret put).
[vars]
VAPID_PUBLIC_KEY = "BKc4SYnZdmsjhQ5kHHJpJE4PfsT3BYhKts6V0_pGvk8Y2KEo5oWTXLGMRraEYJyH62HveWQalgdYsO8aSkiGxlI"
VAPID_SUBJECT = "https://opencommunity.app"
# Decision copies emailed to arbiters (Resend). "on" = GO de Popol 21/10; anything else = OFF.
ARBITER_DECISION_EMAILS = "on"

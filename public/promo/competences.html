<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fb" />
    <meta name="description" content="Avez-vous une compétence qui serait profitable dans votre quartier ? Faites-le savoir. Inscription gratuite." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:title" content="Faites connaître votre compétence" />

    <meta property="og:image" content="http://opencommunity.app/promo/competences.png" />
    <title>Faites connaître votre compétence · Open Community</title>
    <style>
      *{box-sizing:border-box} html,body{margin:0;min-height:100%}
      body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:1.25rem;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6fb;color:#142033}
      main{width:min(28rem,100%);text-align:center}
      a.card{display:block;text-decoration:none;color:inherit}
      a.card img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 12px 28px rgba(20,32,51,.12)}
      a.cta{display:inline-flex;align-items:center;justify-content:center;margin-top:1.25rem;min-height:3.25rem;min-width:min(100%,16rem);padding:.9rem 1.6rem;border-radius:999px;background:#2563eb;color:#fff;font-size:1.15rem;font-weight:700;text-decoration:none}
      .hint{margin-top:.85rem;font-size:.9rem;color:#5b6b7c}
      .hint a{color:#1d4ed8}
    </style>
  </head>
  <body>
    <main>
      <a class="card" href="http://opencommunity.app/">
        <img src="./competences.png" width="1200" height="900" alt="Open Community — Faites connaître votre compétence. Cliquez ici." />
      </a>
      <a class="cta" href="http://opencommunity.app/">Cliquez ici</a>
      <p class="hint">Lien direct : <a href="http://opencommunity.app/">opencommunity.app</a></p>
    </main>
  </body>

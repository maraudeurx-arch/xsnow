<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fb" />
    <meta
      name="description"
      content="Open Community — Monétisé Vous! Inscription gratuite."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:title" content="Open Community — Monétisé Vous!" />
    <meta
      property="og:description"
      content="Open Community — Monétisé Vous! Inscription gratuite."
    />
    <meta property="og:url" content="https://maraudeurx-arch.github.io/xsnow/promo/" />
    <title>Open Community — Monétisé Vous!</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(1.5rem, env(safe-area-inset-top, 0px))
          max(1.25rem, env(safe-area-inset-right, 0px))
          max(1.75rem, env(safe-area-inset-bottom, 0px))
          max(1.25rem, env(safe-area-inset-left, 0px));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f4f6fb;
        color: #142033;
      }
      main {
        width: min(38rem, 100%);
        text-align: center;
      }
      .logo {
        margin: 0 0 1.35rem;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .logo a {
        color: #1d4ed8;
        text-decoration: none;
      }
      h1 {
        margin: 0 0 1.85rem;
        font-size: clamp(1.35rem, 5.6vw, 2rem);
        line-height: 1.35;
        font-weight: 650;
      }
      a.cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        min-width: min(100%, 17rem);
        padding: 0.95rem 1.8rem;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }
      a.cta:hover,
      a.cta:focus-visible {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="logo">
        <a href="https://maraudeurx-arch.github.io/xsnow/">Open Community</a>
      </p>
      <h1>Open Community — Monétisé Vous! Inscription gratuite.</h1>
      <a class="cta" href="https://maraudeurx-arch.github.io/xsnow/">Cliquez ici</a>
    </main>
  </body>
</html>
